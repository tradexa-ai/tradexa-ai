workflows:
  tradexa-android:
    name: Tradexa Android
    max_build_duration: 20
    instance_type: linux
    environment:
      groups:
        - expo
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android APK
        script: |
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
